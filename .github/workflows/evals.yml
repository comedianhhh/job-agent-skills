name: Skill evals

# Real model calls, so this never runs on push or on a schedule. Trigger it by hand
# (Actions → Skill evals → Run workflow) when a repository secret below is set.
#
# Auth, either secret works (the OAuth token wins when both are set):
#   CLAUDE_CODE_OAUTH_TOKEN  `claude setup-token` on a Pro/Max/Team login; runs on the subscription,
#                            no API billing; valid one year, tied to the account that created it
#   ANTHROPIC_API_KEY        a Console API key; billed per token
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke = 1 run per case, plugin arm only; full = 3 runs + no-plugin baseline"
        type: choice
        default: smoke
        options: [smoke, full]
      case:
        description: "optional --case glob, e.g. offer/*"
        default: ""
# No schedule: the weekly smoke run happens on the maintainer's machine with the logged-in CLI
# (a local scheduled task runs `bash evals/run.sh --smoke`), so CI needs no model credentials.

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check credentials
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add a CLAUDE_CODE_OAUTH_TOKEN (claude setup-token) or ANTHROPIC_API_KEY repository secret"
            exit 1
          fi
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] && echo "auth: subscription OAuth token" || echo "auth: API key"
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code && claude --version
      - name: Run
        run: |
          # An unset secret arrives as an empty string; drop the API key then (or when the OAuth token is
          # set) so the CLI does not pick up an empty or competing credential.
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then unset ANTHROPIC_API_KEY; fi
          [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && unset CLAUDE_CODE_OAUTH_TOKEN
          mode="${{ github.event.inputs.mode || 'smoke' }}"
          extra=()
          [ -n "${{ github.event.inputs.case }}" ] && extra+=(--case "${{ github.event.inputs.case }}")
          if [ "$mode" = full ]; then
            evals/run.sh --json evals/results.json --model claude-sonnet-5 --judge-model claude-haiku-4-5 --max-cost-usd 40 "${extra[@]}"
          else
            evals/run.sh --smoke --json evals/results.json --model claude-sonnet-5 --judge-model claude-haiku-4-5 --max-cost-usd 15 "${extra[@]}"
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            evals/results.json
            evals/results/**/report.html
          if-no-files-found: ignore
