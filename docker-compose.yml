# One command brings up the tracker: `docker compose up`
#   web  http://localhost:3000   Next.js board + scan page
#   api  http://localhost:8000   FastAPI over ./career (tracker.md, targets.yaml, SCAN-*.md)
#   db   Postgres for scan history and status events
# Point CAREER_DIR at your private career/ workspace (default: ./career next to this file).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: web/api/Dockerfile
    environment:
      CAREER_DIR: /career
      DATABASE_URL: postgresql+psycopg://tracker:tracker@db:5432/tracker
    volumes:
      - ${CAREER_DIR:-./career}:/career
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: web/app
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
