# One command brings up the tracker:  cp .env.example .env  →  edit  →  docker compose up --build
#   web  http://localhost:3000   Next.js board + scan page; proxies /api/* to the api container
#   api  (internal only)         FastAPI over ./career (tracker.md, targets.yaml, SCAN-*.md)
#   db   (internal only)         Postgres for scan history and status events
# Every request needs TRACKER_TOKEN (paste it once in the browser). Put HTTPS in front if remote.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracker}
      POSTGRES_DB: tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: web/api/Dockerfile
    environment:
      CAREER_DIR: /career
      DATABASE_URL: postgresql+psycopg://tracker:${POSTGRES_PASSWORD:-tracker}@db:5432/tracker
      TRACKER_TOKEN: ${TRACKER_TOKEN:?set TRACKER_TOKEN in .env (python -c "import secrets;print(secrets.token_urlsafe(32))")}
    volumes:
      - ${CAREER_DIR:-./career}:/career
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: web/app
    environment:
      API_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
