[project]
name = "jobs-mcp"
version = "0.1.0"
description = "MCP server that lets an agent scan public job boards: Greenhouse, Lever, Ashby, LinkedIn guest search."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=1.10", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
rank = ["fastembed>=0.4"]  # optional dense re-ranking for scan(rank_query=...)

[project.scripts]
jobs-mcp = "jobs_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobs_mcp"]

# The plugin runs `uvx --from ./mcp/jobs-mcp`. By default uv only rebuilds a local package
# when pyproject.toml changes, so source edits would never reach the running server.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "jobs_mcp/**/*.py" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
