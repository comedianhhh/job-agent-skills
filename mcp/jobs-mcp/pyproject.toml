[project]
name = "jobs-mcp"
version = "0.1.0"
description = "MCP server that lets an agent scan public job boards: Greenhouse, Lever, Ashby, LinkedIn guest search."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=1.10", "httpx>=0.27"]

[project.scripts]
jobs-mcp = "jobs_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobs_mcp"]
