[project]
name = "tracker-api"
version = "0.1.0"
description = "FastAPI backend for the job-agent-skills tracker: reads/writes career/tracker.md, runs jobs-mcp scans, keeps scan + event history in Postgres."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pyyaml>=6",
    "pydantic>=2",
    "jobs-mcp",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.uv.sources]
jobs-mcp = { path = "../../mcp/jobs-mcp", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracker_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]  # Depends(...) in defaults is the FastAPI idiom

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E501"]  # the tracker fixture keeps real-width rows on purpose
